<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>deferred-unmount — modal</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 2rem auto;
        max-width: 36rem;
        padding: 0 1rem;
      }

      /* ── ユーザーリスト ── */
      .user-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0.75rem 1rem;
        border: 1px solid #ddd;
        border-radius: 6px;
        margin-bottom: 0.5rem;
      }

      .user-row button {
        padding: 0.25rem 0.75rem;
        cursor: pointer;
      }

      .user-row button:disabled {
        opacity: 0.5;
        cursor: default;
      }

      #status {
        font-size: 0.8rem;
        color: #666;
        min-height: 1.4em;
        margin-top: 0.5rem;
      }

      /* ── モーダルオーバーレイ ── */
      .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.45);
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        transition: opacity 0.25s ease;
      }

      .modal-overlay.is-open {
        opacity: 1;
      }

      /* ── モーダルパネル ── */
      .modal {
        background: #fff;
        border-radius: 8px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        width: min(92vw, 28rem);
        transform: translateY(16px);
        transition: transform 0.25s ease;
      }

      .modal-overlay.is-open .modal {
        transform: translateY(0);
      }

      .modal-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 1.25rem 1.5rem 0;
      }

      .modal-header h2 {
        margin: 0;
        font-size: 1rem;
      }

      .modal-close {
        background: none;
        border: none;
        font-size: 1.25rem;
        cursor: pointer;
        color: #666;
        line-height: 1;
        padding: 0.25rem;
      }

      .modal-body {
        padding: 1rem 1.5rem;
        color: #444;
        line-height: 1.6;
      }

      .modal-footer {
        display: flex;
        justify-content: flex-end;
        gap: 0.5rem;
        padding: 0 1.5rem 1.25rem;
      }

      .modal-footer button {
        padding: 0.5rem 1rem;
        border-radius: 4px;
        cursor: pointer;
        border: 1px solid #ddd;
        background: #fff;
      }

      .btn-danger {
        background: #e53e3e !important;
        color: #fff;
        border-color: #c53030 !important;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <h1>deferred-unmount</h1>
      <p>useDeferredUnmount — モーダルの退場アニメーション後に DOM を削除する</p>

      <div class="user-list">
        <div class="user-row">
          <span>山田 太郎</span>
          <button data-ref="openBtn" type="button">削除</button>
        </div>
      </div>
      <p id="status" data-ref="status"></p>
      <div data-ref="container"></div>
    </div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
